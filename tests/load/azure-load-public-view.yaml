version: v0.1
testId: public-view-azure-host
displayName: Public View Azure Host
description: Read-path load test against the direct App Service hostname for index, status, and announcement endpoints.
testType: Locust
testPlan: locust_public_view.py
engineInstances: 2
properties:
  userPropertyFile: public_view.locust.conf
env:
  - name: LOCUST_HOST
    value: https://attendancev2app7t5g81ps.azurewebsites.net
  - name: BASE_URL
    value: https://attendancev2app7t5g81ps.azurewebsites.net
failureCriteria:
  - percentage(error) > 10
  - p95(response_time_ms) > 4000
