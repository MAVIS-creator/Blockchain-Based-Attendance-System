; Staging PHP-FPM pool for 4 vCPU/16 GB VM.
; Measure each real worker RSS and DB memory before increasing children.
[bbas]
user = bbas
group = bbas
listen = /run/php/php8.2-fpm-bbas.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 400
request_terminate_timeout = 40s
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
