# Example backend origin. Before installation:
# 1. Replace domain and PHP-FPM socket path.
# 2. Install trusted TLS certificate (e.g. certbot) and enforce HTTPS.
# 3. Block unsolicited inbound origin traffic if behind a trusted proxy.
# 4. Restrict public files to the intended deployment checkout.
server {
    listen 80;
    server_name api.attendance.example.com;
    root /srv/bbas/app;
    index index.php;

    client_max_body_size 2m;
    keepalive_timeout 15s;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Private source, runtime, migration and build paths are never public.
    location ~* ^/(?:storage|src|vendor|tools|tests|docs|db|deploy|\.git|\.github|\.deploy|node_modules|\.vercel)(?:/|$) { return 404; }
    location ~* /(?:\.env(?:\..*)?|composer\.(?:json|lock)|package(?:-lock)?\.json|vercel\.json|phpunit\.xml|\.htaccess)$ { return 404; }
    location ~* \.(?:jsonl?|log|sql|conf|ini|bak|zip|tar|gz|md|txt|sh|ps1)$ { return 404; }
    location ~ /\. { return 404; }

    location ~* \.(?:css|js|png|jpe?g|gif|webp|svg|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 35s;
        fastcgi_connect_timeout 5s;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
}
