name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false # DO NOT pull submodules — vendor is managed by Composer

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, intl, pdo_mysql
        coverage: none

    - name: Authenticate Composer with GitHub
      run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    - name: PHP syntax lint (all project sources)
      run: find . -path './vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

    - name: Security regression checks
      run: php tests/security_smoke.php

    - name: Isolated HTTP endpoint smoke checks
      run: bash tests/http_smoke.sh

    - name: Concurrent attendance chain append regression
      run: bash tests/chain_concurrency.sh

    - name: Shared-IP request counter regression
      run: php tests/request_guard_atomic.php
