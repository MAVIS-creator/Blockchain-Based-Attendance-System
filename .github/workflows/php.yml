name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.5']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: bbas_ci
          MARIADB_USER: bbas_ci
          MARIADB_PASSWORD: ci_test_only
          MARIADB_ROOT_PASSWORD: ci_root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false # DO NOT pull submodules — vendor is managed by Composer

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '${{ matrix.php }}'
        extensions: mbstring, intl, pdo_mysql
        coverage: none

    - name: Authenticate Composer with GitHub
      run: composer config --global github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress --no-interaction
    - name: PHP syntax lint (all project sources)
      run: find . -path './vendor' -prune -o -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

    - name: Security regression checks
      run: php tests/security_smoke.php

    - name: Isolated HTTP endpoint smoke checks
      run: bash tests/http_smoke.sh

    - name: Concurrent attendance chain append regression
      run: bash tests/chain_concurrency.sh

    - name: Shared-IP request counter regression
      run: php tests/request_guard_atomic.php

    - name: AI rules fallback regression
      run: php tests/ai_rules_smoke.php

    - name: Vercel frontend JS syntax
      run: node --check web/app.js && node -e "JSON.parse(require('fs').readFileSync('web/vercel.json','utf8'))"

    - name: Post-submit durable enqueue regression
      run: php tests/post_submit_queue_smoke.php

    - name: MariaDB transaction and job queue integration
      run: php tests/mysql_queue_smoke.php

    - name: MariaDB attendance transaction, receipts and outbox
      env:
        BBAS_SQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=bbas_ci;charset=utf8mb4
        BBAS_SQL_USER: bbas_ci
        BBAS_SQL_PASSWORD: ci_test_only
      run: php tests/attendance_sql_authority.php

    - name: Guarded AI attendance write regression
      run: php tests/ai_attendance_atomic.php

    - name: Persistent data disk fail-closed regression
      run: php tests/storage_path_fail_closed.php

    - name: Automatic recovery privilege boundary
      run: php tests/recovery_policy_smoke.php

    - name: Geofence evidence regression
      run: php tests/geofence_evidence_smoke.php

    - name: Ticket capability and public context HTTP regression
      run: python3 tests/ticket_status_http.py

    - name: Unified admin dashboard credentials
      run: php tests/unified_admin_dashboard_smoke.php
